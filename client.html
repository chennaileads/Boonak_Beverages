	.floating-contact {
  position: fixed;
  right: 15px;
  top: 90%;
  transform: translateY(-50%);
  z-index: 9999;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

/* Buttons */
.contact-btn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: none;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #fff;
  font-size: 22px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.3);
}

.whatsapp { background: #176835; }
.call { background: #c62828; }

/* Floating Enquiry Box */
.enquiry-float {
  position: fixed;
  right: 20px;
  width: 260px;
  background: #fff;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  z-index: 9999;
    display: none;
}
/* Form */
.enquiry-float form h4 {
  margin-bottom: 10px;
  text-align: center;
}

.enquiry-float input,
.enquiry-float textarea {
  width: 100%;
  padding: 8px;
  margin-bottom: 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.enquiry-btn {
  width: 100%;
  background: #e63946;
  color: #fff;
  border: none;
  padding: 10px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 15px;
}

.enquiry-btn:hover {
  background: #c92f3c;
}
	.footer-flex {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}

/* Social icons inline */
.social-list {
    display: flex;
    gap: 12px;
    margin: 0;
    padding: 0;
    list-style: none;
}

/* Mobile responsive */
@media (max-width: 768px) {
    .footer-flex {
        flex-direction: column;
        text-align: center;
        gap: 10px;
    }
}

  <script>
  const toggleBtn = document.getElementById("callToggle");
  const enquiryBox = document.getElementById("enquiryBox");

  toggleBtn.addEventListener("click", () => {
    enquiryBox.style.display =
      enquiryBox.style.display === "block" ? "none" : "block";
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".floating-contact")) {
      enquiryBox.style.display = "none";
    }
  });
  toggleBtn.addEventListener("click", () => {
  enquiryBox.classList.toggle("show");
});
</script>
